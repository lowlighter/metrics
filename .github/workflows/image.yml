name: Image
on:
  push:
    branches: [modern, patched]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tronicum/metrics:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/tronicum/metrics
          cache-from: type=gha
          cache-to: type=gha,mode=max
